[project]
name = "agent-smith"
version = "0.1.0"
description = "Autonomous code agent for MBPP and SWE-bench tasks"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "pydantic>=2.13.5",
]

[project.scripts]
agent-smith = "agent_smith:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
