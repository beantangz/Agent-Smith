[project]
name = "agent-smith"
version = "0.1.0"
description = "Autonomous code agent for MBPP and SWE-bench tasks"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2.0",
    "pydantic>=2.13.5",
]

[project.scripts]
agent-smith = "agent_smith:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]